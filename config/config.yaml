# config/config.yaml
model:
  name: "StyleGenieRecommender"
  version: "v1.0"
  
data:
  source: "hm_fashion"
  train_size: 0.8
  val_size: 0.1
  test_size: 0.1
  
training:
  batch_size: 32
  learning_rate: 0.001
  epochs: 50
  early_stopping_patience: 5
  
preprocessing:
  max_features: 1000
  min_interactions: 5
  
api:
  host: "localhost"
  port: 5000
  model_path: "data/models/stylegenie_model.pkl"